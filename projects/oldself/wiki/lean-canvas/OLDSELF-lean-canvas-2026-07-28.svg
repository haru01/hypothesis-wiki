<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="sans-serif">
  <rect x="0" y="0" width="1200" height="720" fill="#ffffff"/>
  <text x="580" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#212121">リーンキャンバス — self / セグメント: 新規事業・プロダクト開発の実践者 （2026-07-28・ステージ CPF）</text>
  <text x="1196" y="26" text-anchor="end" font-size="10" fill="#616161">✓検証済み ?未検証 ✗反証 灰=未着手</text>

  <!-- 課題 (Problem) — 未検証 -->
  <g>
    <rect x="0" y="40" width="240" height="520" fill="#ffffff" stroke="#f9a825" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="0" y="40" width="240" height="26" fill="#f9a825"/>
    <text x="8" y="58" font-size="13" font-weight="bold" fill="#4e342e">課題 (Problem)</text>
    <text x="8" y="86" font-size="12" fill="#212121"><tspan fill="#ef6c00">? </tspan>記録が残らず散逸・属人化</text>
    <text x="20" y="102" font-size="10" fill="#757575">OLDSELF-H-004 ★核心 確信度6 検証中</text>
    <text x="8" y="126" font-size="12" fill="#212121"><tspan fill="#ef6c00">? </tspan>好意的反応を購買意向と誤認</text>
    <text x="20" y="142" font-size="10" fill="#757575">OLDSELF-H-006 確信度6 検証中</text>
    <text x="8" y="166" font-size="12" fill="#212121"><tspan fill="#ef6c00">? </tspan>経営層に説明できず停滞</text>
    <text x="20" y="182" font-size="10" fill="#757575">OLDSELF-H-008 確信度6 検証中</text>
    <text x="8" y="206" font-size="12" fill="#212121"><tspan fill="#ef6c00">? </tspan>確証バイアスで反証を軽視</text>
    <text x="20" y="222" font-size="10" fill="#757575">OLDSELF-H-005 確信度4 検証中</text>
    <text x="8" y="246" font-size="12" fill="#212121"><tspan fill="#ef6c00">? </tspan>反証不能な曖昧仮説</text>
    <text x="20" y="262" font-size="10" fill="#757575">OLDSELF-H-007 確信度4 検証中</text>
    <text x="8" y="298" font-size="11" font-weight="bold" fill="#424242">既存の代替手段（＝真の競合）</text>
    <text x="8" y="318" font-size="12" fill="#ef6c00">（未記録）</text>
    <text x="8" y="336" font-size="10" fill="#757575">Miro / Notion は OLDSELF-H-009 の</text>
    <text x="8" y="350" font-size="10" fill="#757575">反証条件に名前が出るのみ。</text>
    <text x="8" y="364" font-size="10" fill="#757575">「今どう凌いでいるか」は未調査</text>
  </g>

  <!-- ソリューション (Solution) — 未検証（唯一のエントリは反証） -->
  <g>
    <rect x="240" y="40" width="240" height="260" fill="#ffffff" stroke="#f9a825" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="240" y="40" width="240" height="26" fill="#f9a825"/>
    <text x="248" y="58" font-size="13" font-weight="bold" fill="#4e342e">ソリューション (Solution)</text>
    <text x="248" y="86" font-size="12" fill="#212121"><tspan fill="#c62828">✗ </tspan>AI支援＋構造化記録</text>
    <text x="260" y="102" font-size="10" fill="#757575">OLDSELF-H-009 確信度2 反証</text>
    <text x="248" y="124" font-size="10" fill="#757575">対応課題: H-004 / H-006 / H-008</text>
    <text x="248" y="150" font-size="11" font-weight="bold" fill="#c62828">反証理由（OLDSELF-LEARN-004）</text>
    <text x="248" y="168" font-size="10" fill="#757575">AI出力が「浅い・一般論的」、</text>
    <text x="248" y="182" font-size="10" fill="#757575">Markdown 記録が共同編集派に不評</text>
    <text x="248" y="206" font-size="10" fill="#9e9e9e">※ 架空インタビュー由来</text>
    <text x="248" y="232" font-size="10" fill="#9e9e9e">代替ソリューション案は未起票</text>
  </g>

  <!-- 主要指標 (Key Metrics) — 空白 -->
  <g>
    <rect x="240" y="300" width="240" height="260" fill="#ffffff" stroke="#bdbdbd" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="240" y="300" width="240" height="26" fill="#bdbdbd"/>
    <text x="248" y="318" font-size="13" font-weight="bold" fill="#424242">主要指標 (Key Metrics)</text>
    <text x="248" y="346" font-size="12" fill="#9e9e9e">（未着手）</text>
    <text x="248" y="370" font-size="10" fill="#757575">対応 role: 市場スケール仮説 0件</text>
    <text x="248" y="396" font-size="10" fill="#757575">CPF のレンズでは AARRR の</text>
    <text x="248" y="410" font-size="10" fill="#757575">どの一歩が詰まるかを見る</text>
    <text x="248" y="424" font-size="10" fill="#757575">学習指標が要るが、未定義</text>
  </g>

  <!-- 独自の価値提案 (UVP) — 未検証 -->
  <g>
    <rect x="480" y="40" width="240" height="520" fill="#ffffff" stroke="#f9a825" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="480" y="40" width="240" height="26" fill="#f9a825"/>
    <text x="488" y="58" font-size="13" font-weight="bold" fill="#4e342e">独自の価値提案 (UVP)</text>
    <text x="488" y="86" font-size="11" fill="#c62828">✗ OLDSELF-H-009 からの射影</text>
    <text x="488" y="106" font-size="11" fill="#212121">「AI のツッコミを受けながら</text>
    <text x="488" y="122" font-size="11" fill="#212121">仮説を形成し、検証結果と</text>
    <text x="488" y="138" font-size="11" fill="#212121">確信度を1つの Wiki に記録して</text>
    <text x="488" y="154" font-size="11" fill="#212121">レポート化できる」</text>
    <text x="500" y="172" font-size="10" fill="#757575">確信度2 反証</text>
    <text x="488" y="204" font-size="11" font-weight="bold" fill="#ef6c00">UVP の一文: 未記録</text>
    <text x="488" y="222" font-size="10" fill="#757575">H-009 はソリューション記述で</text>
    <text x="488" y="236" font-size="10" fill="#757575">あり、顧客が得る「成果」を</text>
    <text x="488" y="250" font-size="10" fill="#757575">語る一文にはなっていない</text>
    <text x="488" y="278" font-size="11" font-weight="bold" fill="#ef6c00">ハイレベルコンセプト: 未記録</text>
    <text x="488" y="296" font-size="10" fill="#757575">「（既知の X）の（Y）」型の</text>
    <text x="488" y="310" font-size="10" fill="#757575">比喩が置かれていない</text>
    <text x="488" y="338" font-size="11" font-weight="bold" fill="#ef6c00">既存代替との差別化: 未記録</text>
    <text x="488" y="356" font-size="10" fill="#757575">代替手段そのものが未調査の</text>
    <text x="488" y="370" font-size="10" fill="#757575">ため、差別化が言えない</text>
  </g>

  <!-- 圧倒的優位性 (Unfair Advantage) — 空白 -->
  <g>
    <rect x="720" y="40" width="240" height="260" fill="#ffffff" stroke="#bdbdbd" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="720" y="40" width="240" height="26" fill="#bdbdbd"/>
    <text x="728" y="58" font-size="13" font-weight="bold" fill="#424242">圧倒的優位性 (Unfair Adv.)</text>
    <text x="728" y="86" font-size="12" fill="#9e9e9e">（未着手）</text>
    <text x="728" y="110" font-size="10" fill="#757575">対応 role: 自分たち仮説 0件</text>
    <text x="728" y="136" font-size="10" fill="#757575">記入順は最後（検証の過程で</text>
    <text x="728" y="150" font-size="10" fill="#757575">発見するもの）。空欄が正直</text>
    <text x="728" y="164" font-size="10" fill="#757575">なら空欄でよいブロック</text>
    <text x="728" y="192" font-size="10" fill="#9e9e9e">ただし FPF を一度通過した</text>
    <text x="728" y="206" font-size="10" fill="#9e9e9e">割に自分たち仮説がゼロ</text>
  </g>

  <!-- チャネル (Channels) — 空白 -->
  <g>
    <rect x="720" y="300" width="240" height="260" fill="#ffffff" stroke="#bdbdbd" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="720" y="300" width="240" height="26" fill="#bdbdbd"/>
    <text x="728" y="318" font-size="13" font-weight="bold" fill="#424242">チャネル (Channels)</text>
    <text x="728" y="346" font-size="12" fill="#9e9e9e">（未着手）</text>
    <text x="728" y="370" font-size="10" fill="#757575">対応 role: 市場スケール仮説 0件</text>
    <text x="728" y="396" font-size="11" font-weight="bold" fill="#c62828">CPF レンズでの最大の詰まり</text>
    <text x="728" y="414" font-size="10" fill="#757575">「想定顧客に実際に会える経路」</text>
    <text x="728" y="428" font-size="10" fill="#757575">が未記録。OLDSELF-DEC-002 は実データ</text>
    <text x="728" y="442" font-size="10" fill="#757575">での問題インタビュー再実施を</text>
    <text x="728" y="456" font-size="10" fill="#757575">最優先としているが、到達経路が</text>
    <text x="728" y="470" font-size="10" fill="#757575">無いままでは検証が回らない</text>
  </g>

  <!-- 顧客セグメント (Customer Segments) — 未検証 -->
  <g>
    <rect x="960" y="40" width="240" height="520" fill="#ffffff" stroke="#f9a825" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="960" y="40" width="240" height="26" fill="#f9a825"/>
    <text x="968" y="58" font-size="13" font-weight="bold" fill="#4e342e">顧客セグメント (Customers)</text>
    <text x="968" y="86" font-size="12" fill="#212121"><tspan fill="#ef6c00">? </tspan>作る前に検証を反復する</text>
    <text x="980" y="102" font-size="12" fill="#212121">実践者</text>
    <text x="980" y="118" font-size="10" fill="#757575">OLDSELF-H-001 確信度6 検証中</text>
    <text x="968" y="144" font-size="12" fill="#212121"><tspan fill="#ef6c00">? </tspan>学びが複数ツールに散在</text>
    <text x="980" y="160" font-size="10" fill="#757575">OLDSELF-H-002 確信度6 検証中</text>
    <text x="968" y="186" font-size="12" fill="#212121"><tspan fill="#ef6c00">? </tspan>更新が報告サイクル駆動</text>
    <text x="980" y="202" font-size="10" fill="#757575">OLDSELF-H-003 確信度5 検証中</text>
    <text x="968" y="234" font-size="11" font-weight="bold" fill="#424242">アーリーアダプター</text>
    <text x="968" y="254" font-size="12" fill="#ef6c00">（未記録）</text>
    <text x="968" y="272" font-size="10" fill="#757575">H-008 / H-009 に「説明相手</text>
    <text x="968" y="286" font-size="10" fill="#757575">（経営層）を持つ実践者」と</text>
    <text x="968" y="300" font-size="10" fill="#757575">出るが、先鋒として仮説化</text>
    <text x="968" y="314" font-size="10" fill="#757575">されていない</text>
    <text x="968" y="346" font-size="11" font-weight="bold" fill="#c62828">※ 全エントリが架空データ由来</text>
    <text x="968" y="364" font-size="10" fill="#757575">実インタビュー 0件（OLDSELF-DEC-002</text>
    <text x="968" y="378" font-size="10" fill="#757575">で CPF に巻き戻し済み）</text>
  </g>

  <!-- コスト構造 (Cost Structure) — 空白 -->
  <g>
    <rect x="0" y="560" width="600" height="160" fill="#ffffff" stroke="#bdbdbd" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="0" y="560" width="600" height="26" fill="#bdbdbd"/>
    <text x="8" y="578" font-size="13" font-weight="bold" fill="#424242">コスト構造 (Cost Structure)</text>
    <text x="8" y="608" font-size="12" fill="#9e9e9e">（未着手）— 対応 role: 市場スケール仮説 0件</text>
    <text x="8" y="632" font-size="10" fill="#757575">主要な変動費・固定費（人・インフラ・顧客獲得コスト）がどこにも記録されていない。</text>
    <text x="8" y="650" font-size="10" fill="#757575">収益ブロックと対になる前提であり、両方が空白のため事業として成立するかは全く未検証。</text>
  </g>

  <!-- 収益の流れ (Revenue Streams) — 空白 -->
  <g>
    <rect x="600" y="560" width="600" height="160" fill="#ffffff" stroke="#bdbdbd" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="600" y="560" width="600" height="26" fill="#bdbdbd"/>
    <text x="608" y="578" font-size="13" font-weight="bold" fill="#424242">収益の流れ (Revenue Streams)</text>
    <text x="608" y="608" font-size="12" fill="#9e9e9e">（未着手）— 対応 role: 市場スケール仮説 0件。課金モデル・単価は未定義</text>
    <text x="608" y="632" font-size="10" fill="#c62828">※ OLDSELF-H-010「実践者は対価を払い既存ツールから乗り換える」は確信度2・反証（ソリューション仮説として起票）</text>
    <text x="608" y="650" font-size="10" fill="#757575">架空 LP 提示で行動的な乗り換え／支払い意向は 2/10。〈支払い〉証拠は 0件（interest ≠ intent）。</text>
  </g>
</svg>
