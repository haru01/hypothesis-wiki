<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="sans-serif">
  <rect x="0" y="0" width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#212121">リーンキャンバス — agent-platform / セグメント: シリーズB前後B2B SaaSの基盤チームTL （2026-07-26）</text>

  <!-- 課題 (Problem) 0,40,240,520 未検証 -->
  <g>
    <rect x="0" y="40" width="240" height="520" fill="#ffffff" stroke="#f9a825" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="0" y="40" width="240" height="26" fill="#f9a825"/>
    <text x="8" y="58" font-size="13" font-weight="bold" fill="#ffffff">課題 (Problem)</text>
    <text x="8" y="86" font-size="12" fill="#212121"><tspan fill="#ef6c00">? </tspan>本番でなぜ動いたか追えず</text>
    <text x="8" y="104" font-size="12" fill="#212121">　サイレント失敗 (AGP-H-003)</text>
    <text x="8" y="130" font-size="12" fill="#212121"><tspan fill="#ef6c00">? </tspan>ツール毎コネクタ保守に</text>
    <text x="8" y="148" font-size="12" fill="#212121">　疲弊 (AGP-H-004)</text>
    <text x="8" y="174" font-size="12" fill="#212121"><tspan fill="#ef6c00">? </tspan>デプロイ前の回帰/評価</text>
    <text x="8" y="192" font-size="12" fill="#212121">　テストが無い (AGP-H-006)</text>
    <text x="8" y="230" font-size="11" fill="#616161" font-weight="bold">既存の代替手段:</text>
    <text x="8" y="250" font-size="11" fill="#616161">・自作ログ / LangSmith部分導入</text>
    <text x="8" y="268" font-size="11" fill="#616161">・障害時に手作業でトレース突合</text>
    <text x="8" y="286" font-size="11" fill="#616161">・原因不明でも再起動で凌ぐ</text>
  </g>

  <!-- ソリューション (Solution) 240,40,240,260 未検証 -->
  <g>
    <rect x="240" y="40" width="240" height="260" fill="#ffffff" stroke="#f9a825" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="240" y="40" width="240" height="26" fill="#f9a825"/>
    <text x="248" y="58" font-size="13" font-weight="bold" fill="#ffffff">ソリューション (Solution)</text>
    <text x="248" y="86" font-size="12" fill="#212121"><tspan fill="#ef6c00">? </tspan>統合因果トレース →H-003</text>
    <text x="248" y="110" font-size="12" fill="#212121"><tspan fill="#ef6c00">? </tspan>標準コネクタ層 →H-004</text>
    <text x="248" y="134" font-size="12" fill="#212121"><tspan fill="#ef6c00">? </tspan>本番ガードレール</text>
    <text x="248" y="152" font-size="11" fill="#616161">　(チェックポイント/ロールバック)</text>
    <text x="248" y="176" font-size="12" fill="#212121"><tspan fill="#ef6c00">? </tspan>デプロイ前評価 →H-006</text>
    <text x="248" y="212" font-size="11" fill="#9e9e9e">※LP先取りのみ (AGP-TEST-002)</text>
    <text x="248" y="230" font-size="11" fill="#9e9e9e">※ソリューション仮説は未形成</text>
  </g>

  <!-- 主要指標 (Key Metrics) 240,300,240,260 未検証 -->
  <g>
    <rect x="240" y="300" width="240" height="260" fill="#ffffff" stroke="#f9a825" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="240" y="300" width="240" height="26" fill="#f9a825"/>
    <text x="248" y="318" font-size="13" font-weight="bold" fill="#ffffff">主要指標 (Key Metrics)</text>
    <text x="248" y="346" font-size="12" fill="#212121"><tspan fill="#ef6c00">? </tspan>障害の原因特定時間 (MTTR)</text>
    <text x="248" y="372" font-size="12" fill="#212121"><tspan fill="#ef6c00">? </tspan>横断で監視される</text>
    <text x="248" y="390" font-size="12" fill="#212121">　エージェント数</text>
    <text x="248" y="416" font-size="12" fill="#212121"><tspan fill="#ef6c00">? </tspan>デプロイ前評価の実行率</text>
    <text x="248" y="452" font-size="11" fill="#9e9e9e">※虚栄指標(PV/登録)は避ける</text>
  </g>

  <!-- 独自の価値提案 (UVP) 480,40,240,520 未検証 -->
  <g>
    <rect x="480" y="40" width="240" height="520" fill="#ffffff" stroke="#f9a825" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="480" y="40" width="240" height="26" fill="#f9a825"/>
    <text x="488" y="58" font-size="13" font-weight="bold" fill="#ffffff">独自の価値提案 (UVP)</text>
    <text x="488" y="90" font-size="13" fill="#212121"><tspan fill="#ef6c00">? </tspan>「作る」ではなく</text>
    <text x="488" y="110" font-size="13" fill="#212121">　「本番で動かし続ける」</text>
    <text x="488" y="130" font-size="13" fill="#212121">　ための水平レイヤー</text>
    <text x="488" y="164" font-size="12" fill="#212121">散在エージェントの"なぜ"を</text>
    <text x="488" y="182" font-size="12" fill="#212121">1本の因果トレースに。</text>
    <text x="488" y="230" font-size="11" fill="#616161" font-weight="bold">ハイレベルコンセプト:</text>
    <text x="488" y="250" font-size="11" fill="#616161">「エージェントのSRE基盤」</text>
    <text x="488" y="300" font-size="11" fill="#9e9e9e">※代替(自作ログ)との決定的な</text>
    <text x="488" y="318" font-size="11" fill="#9e9e9e">　差別化は未検証</text>
  </g>

  <!-- 圧倒的優位性 (Unfair Advantage) 720,40,240,260 空白 -->
  <g>
    <rect x="720" y="40" width="240" height="260" fill="#ffffff" stroke="#bdbdbd" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="720" y="40" width="240" height="26" fill="#bdbdbd"/>
    <text x="728" y="58" font-size="13" font-weight="bold" fill="#ffffff">圧倒的優位性 (Unfair Advantage)</text>
    <text x="728" y="90" font-size="12" fill="#9e9e9e">（未着手）</text>
    <text x="728" y="124" font-size="11" fill="#616161">候補（未確立・優位性か要吟味）:</text>
    <text x="728" y="144" font-size="11" fill="#616161">・横断トレースの蓄積データ</text>
    <text x="728" y="162" font-size="11" fill="#616161">・失敗分類オントロジー</text>
    <text x="728" y="186" font-size="11" fill="#9e9e9e">※自分たち仮説は未形成</text>
  </g>

  <!-- チャネル (Channels) 720,300,240,260 未検証 -->
  <g>
    <rect x="720" y="300" width="240" height="260" fill="#ffffff" stroke="#f9a825" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="720" y="300" width="240" height="26" fill="#f9a825"/>
    <text x="728" y="318" font-size="13" font-weight="bold" fill="#ffffff">チャネル (Channels)</text>
    <text x="728" y="342" font-size="11" fill="#616161" font-weight="bold">初期＝顧客への道 (CPF):</text>
    <text x="728" y="362" font-size="12" fill="#212121"><tspan fill="#ef6c00">? </tspan>基盤TL/SREコミュニティ</text>
    <text x="728" y="386" font-size="12" fill="#212121"><tspan fill="#ef6c00">? </tspan>OSS界隈(LangChain/CrewAI)</text>
    <text x="728" y="410" font-size="12" fill="#212121"><tspan fill="#ef6c00">? </tspan>紹介・人脈で次の5人へ</text>
    <text x="728" y="446" font-size="11" fill="#9e9e9e">※実際に会える経路は未検証</text>
  </g>

  <!-- 顧客セグメント (Customer Segments) 960,40,240,520 未検証 -->
  <g>
    <rect x="960" y="40" width="240" height="520" fill="#ffffff" stroke="#f9a825" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="960" y="40" width="240" height="26" fill="#f9a825"/>
    <text x="968" y="58" font-size="13" font-weight="bold" fill="#ffffff">顧客セグメント (Customer)</text>
    <text x="968" y="86" font-size="12" fill="#212121"><tspan fill="#ef6c00">? </tspan>シリーズB前後 B2B SaaS</text>
    <text x="968" y="110" font-size="12" fill="#212121"><tspan fill="#ef6c00">? </tspan>基盤/プラットフォーム</text>
    <text x="968" y="128" font-size="12" fill="#212121">　チームのTL (AGP-H-005)</text>
    <text x="968" y="230" font-size="11" fill="#616161" font-weight="bold">アーリーアダプター:</text>
    <text x="968" y="250" font-size="11" fill="#616161">複数チームが本番エージェントを</text>
    <text x="968" y="268" font-size="11" fill="#616161">出し始め、横断火消しに追われる</text>
    <text x="968" y="286" font-size="11" fill="#616161">基盤TL</text>
    <text x="968" y="330" font-size="11" fill="#9e9e9e">※実在の裏取りは未実施</text>
    <text x="968" y="348" font-size="11" fill="#9e9e9e">　(架空インタビューのみ)</text>
  </g>

  <!-- コスト構造 (Cost Structure) 0,560,600,160 未検証 -->
  <g>
    <rect x="0" y="560" width="600" height="160" fill="#ffffff" stroke="#f9a825" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="0" y="560" width="600" height="26" fill="#f9a825"/>
    <text x="8" y="578" font-size="13" font-weight="bold" fill="#ffffff">コスト構造 (Cost Structure)</text>
    <text x="8" y="606" font-size="12" fill="#212121"><tspan fill="#ef6c00">? </tspan>LLM推論 / トレースストレージ費　　<tspan fill="#ef6c00">? </tspan>エンジニア人件費（基盤開発）</text>
    <text x="8" y="630" font-size="12" fill="#212121"><tspan fill="#ef6c00">? </tspan>顧客獲得コスト（初期は手売り）</text>
    <text x="8" y="666" font-size="11" fill="#9e9e9e">※単価・規模の根拠は未検証</text>
  </g>

  <!-- 収益の流れ (Revenue Streams) 600,560,600,160 未検証 -->
  <g>
    <rect x="600" y="560" width="600" height="160" fill="#ffffff" stroke="#f9a825" stroke-width="1.5" stroke-dasharray="6 4"/>
    <rect x="600" y="560" width="600" height="26" fill="#f9a825"/>
    <text x="608" y="578" font-size="13" font-weight="bold" fill="#ffffff">収益の流れ (Revenue Streams)</text>
    <text x="608" y="606" font-size="12" fill="#212121"><tspan fill="#ef6c00">? </tspan>SaaS従量課金（エージェント数 / トレース量）</text>
    <text x="608" y="630" font-size="12" fill="#212121"><tspan fill="#ef6c00">? </tspan>Team ¥XX,XXX/月・Enterprise 要相談</text>
    <text x="608" y="666" font-size="11" fill="#d32f2f">※〈支払い〉証拠ゼロ（WTP未検証・最脆弱）</text>
  </g>

  <!-- 凡例 -->
  <text x="600" y="712" text-anchor="middle" font-size="11" fill="#616161">凡例: ✓=検証済み ／ ?=未検証 ／ 灰=未着手　│　全ブロック未検証・空白 → これは「仮説キャンバス」（検証済みではない）</text>
</svg>
