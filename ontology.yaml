# 仮説検証Wiki オントロジー（SSoT・全プロジェクト共有）
#
# このファイルが語彙・型・関係・状態機械の唯一の正本(Single Source of Truth)。
# - ツール（tools/hwlint.py・tools/gen_views.py）は tools/ontology.py 経由でここを読む。
#   enum や STAGE_FOCUS 等をコードに再定義しない（＝二重管理・ドリフト防止）。
# - 人間可読な要約 ontology.md は `python3 tools/gen_ontology_doc.py` でここから生成する（手編集禁止）。
#
# 用語（Ontology-Playground 流）:
#   entity   = レコード種別（H / TEST / LEARN / DEC）とそのサブタイプ（frontmatter type の enum）
#   field    = レコードの frontmatter キー。required（必須か）・kind（値の種別）に加えて、
#              description（何を書くか）・guidance（なぜそう書くか）・example・default・
#              required-when（条件付き必須）を宣言する。**フィールドは自己記述的であること** —
#              説明を雛形や CLAUDE.md に置くと四重管理になり、AI は散文を読まないと書けない。
#              「スキーマが契約」＝宣言に無いキーはタイポ、required の欠落は error として lint が弾く。
#   relation = レコード間の型付きリンク。domain（始点の型）→ range（終点の型）、
#              cardinality（one=単一 / many=配列）、inverse（逆方向の呼称）を宣言する。
#   各 relation は frontmatter 配列 と 本文 wikilink の二重表現を持つ（must-wikilink: true）。
#   attachment = レコードではないが型付きリンクを持つ「付随物」（下記 attachments 節）。
#              親レコードに従属し、独自のID体系を持たない（ファイル名 = 親ID + suffix）。
#   provenance = グラフの外（不変層 sources/）を指す出典属性。relation とは別概念（下記 provenance 節）。
#   structured-field = 「行の集まり」を持つ frontmatter フィールド（配列 of マッピング）。
#              判定・成功基準・実測のように *1レコードに複数行* あり *行の中に構造* があるものは
#              平坦な key: value では表せない。行のキーと語彙を宣言する（下記 structured-fields 節）。

# スキーマ版。生成ビューのヘッダに ontology-version として刻まれる（どの版で射影した生成物かを追える）。
# 3: 判定の粒度と成功基準を機械可読にした（judgments / success-criteria / measurements・data 必須化）
# 4: フィールド宣言を自己記述化した（field-kinds のデータ化・全フィールドに description・
#    required-when・反証条件 falsifier の正式化）。JSON Schema 出力 schema/*.schema.json を追加。
version: 4

# ── フィールドの kind（値の種別） ───────────────────────────────────
# かつてはここに `#` コメントで書いていたが、コメントは機械にも AI にも読めない。
# データにして `check_fields` の汎用検証を駆動させる（kind ごとに手書きの分岐を持たない）。
#
# validate = hwlint の check_fields が適用する検証器:
#   none              … check_fields では検証しない（別の専用チェックが担う。下記 owner を参照）
#   id / subtype / enum / date / flag / int-range / auto-or-int-range
# range-ref = int-range 系が参照する数値域（state-machines 配下のキー名）
# owner     = validate: none のとき、その値を実際に検証しているチェック（説明のためだけに書く）
field-kinds:
  id:
    description: ファイル名と一致する接頭辞つきID（例 SELF-H-001）
    validate: none
    owner: id-filename
  text:
    description: 自由記述の一行
    validate: none
  subtype:
    description: 当該 entity の subtypes 名
    validate: subtype
  enum:
    description: enum-ref が指す状態機械の語彙（stages / statuses / outcomes / data-kinds）
    validate: enum
  date:
    description: YYYY-MM-DD
    validate: date
  confidence:
    description: confidence.min〜max の整数
    validate: int-range
    range-ref: confidence
  importance:
    description: auto、または confidence.min〜max の整数（auto は stage-focus から解決する）
    validate: auto-or-int-range
    range-ref: confidence
  flag:
    description: true / false。true のときだけ意味を持つ省略可フィールド（未記入＝false 扱い）
    validate: flag
  relation:
    description: 関係キー。型（domain/range/cardinality）の正本は下記 relations 節
    validate: none
    owner: refs
  provenance:
    description: 出典キー。仕様の正本は下記 provenance 節
    validate: none
    owner: provenance
  structured:
    description: 行の集まり（配列 of マッピング）。行の形の正本は下記 structured-fields 節
    validate: none
    owner: struct-shape

# ── 条件付き必須（required-when）の書き方 ───────────────────────────
# required: false だが「ある条件では書かれているべき」フィールドの宣言。かつては Python の
# 専用チェックにしか存在せず、スキーマを読んだだけでは条件が分からなかった。
#   condition   … 人間・AI 向けの条件文（必須）
#   severity    … 満たさないときの重さ（warning / error）
#   when        … 機械が評価できる形。現在 `always` のみ。省略時は check_fields は評価しない
#   enforced-by … 別チェックが担うならその名前。書かれていれば check_fields は評価しない
#                 （二重報告を避ける。宣言は「AI に見せる」ためだけに置く）
#
# ── 二重表現（must-body-section） ───────────────────────────────────
# frontmatter と本文の**両方**に同じ内容を置くフィールドの宣言。関係の must-wikilink・
# 出典の must-body-link と同じ思想で、値は機械が読める場所に、読み手が出会う場所にも置く。
# 宣言しただけでは守られないので `hwlint` の `field-body-section`（warning）が照合する:
# 節が無い／本文と frontmatter が食い違う（空白・強調記号の差は無視する）。

# ── エンティティ（レコード種別とサブタイプ） ─────────────────────────────
entities:
  H:
    label: 仮説
    dir: hypotheses
    description: 反証可能な仮説文。追記専用の確信度履歴テーブルを正本として持ち、TEST/LEARN/DEC から検証・更新される。事業の前提を1つずつ言語化した検証の起点。
    fields:
      - name: id
        required: true
        kind: id
        description: ファイル名と一致する接頭辞つきID。三者一致（ファイル名＝id＝本文の参照先）が規約。
        example: SELF-H-001
      - name: title
        required: true
        kind: text
        description: 仮説の内容が一読で分かる短いタイトル。本文 H1 と一致させる。
        example: 実践者は作る前に顧客と話し、検証をセット単位で反復している
      - name: short-title
        required: false
        kind: text
        description: list ビューの mermaid ノード用の短ラベル（8字程度）。省略時はタイトルを機械切り詰め。
        example: 検証を反復
      - name: falsifier
        required: true
        kind: text
        # 二重表現（frontmatter ＋ 本文節）。relations の must-wikilink・provenance の
        # must-body-link と同じ思想で、宣言したものを機械が守る。
        must-body-section: 反証条件
        description: 何が観測されればこの仮説が反証されるか。仮説文と対で、検証を始める前に確定する。
        guidance: |
          反証条件を言えない文は仮説ではない（/formulating の鉄則）。ここが機械可読だと
          「この仮説は何が起きたら崩れるか」を frontmatter から直接引ける — 実験計画(TEST)の
          成功基準に事前登録する文言の出どころであり、board が実験ブロックへ射影する。
          本文 `## 反証条件` 節にも同じ文言を置く（二重表現）。文言の変更は仮説の意味の変更なので、
          確信度履歴に影響する見直しと同じ重さで扱う。
        example: 実践者の多くが作る前の顧客接点を持たない、または検証を一度きりで終えて反復していない。
      - name: type
        required: true
        kind: subtype
        description: 価値連鎖上のどの仮説か。ステージごとの重点タイプ（stage-focus）と照合され importance に効く。
        example: 状況・行動仮説
      - name: status
        required: true
        kind: enum
        enum-ref: statuses
        description: 検証の進捗。確信度とは別軸で、確信度履歴テーブル最終行の同期キャッシュ。
        default: 未検証
      - name: confidence
        required: true
        kind: confidence
        description: 証拠の強さの目安。確信度履歴テーブル最終行の同期キャッシュ（正本は本文の表）。
        guidance: |
          直接書き換えない。変更は必ず学び(LEARN)か意思決定(DEC)に紐づけ、本文の確信度履歴に
          1行追記してからその値をここへ写す（不変ルール1・2）。
        default: 1
      - name: stage
        required: true
        kind: enum
        enum-ref: stages
        description: この仮説を主に検証するステージ。プロジェクトの現在ステージとは独立に持つ。
        default: CPF
      - name: importance
        required: false
        kind: importance
        description: 検証の優先度。auto なら現在ステージの stage-focus から importance-weights で解決する。
        default: auto
      - name: derived-from
        required: false
        kind: relation
        description: 枝分かれ元の仮説（1件）。ピボット・巻き戻しの再出発点を系譜として残す。
        guidance: 本文「系譜」節にも wikilink を併記する（frontmatter だけでは Obsidian グラフに辺が出ない）。
        example: SELF-H-003
      - name: leads-to
        required: false
        kind: relation
        description: この仮説が成り立つと次に導かれる仮説（複数可）。list ビューの mermaid 矢印になる。
        guidance: |
          本文「系譜」節にも wikilink を併記する。この辺の推移閉包が「崩れると波及が大きい背骨」＝
          board の「次に検証すべき仮説」の下流依存度になる。
        example: "[SELF-H-004, SELF-H-005]"
      - name: addresses
        required: false
        kind: relation
        description: このソリューション仮説が解こうとする課題仮説（複数可）。relations のフィット表になる。
        guidance: "本文 wikilink は不要（must-wikilink: false）。フィット表は frontmatter から射影する。"
        example: "[SELF-H-003]"
      - name: core
        required: false
        kind: flag
        description: 核心仮説なら true（list ビューで ★ 表示）。未記入は false 扱い。
        example: "true"
    # サブタイプは価値連鎖（行動→課題→解決→市場スケール／自分たち）の順。
    # key        = list の mermaid subgraph ID / chain-label = その表示名 / role = 価値連鎖上の役割
    subtypes:
      - name: 状況・行動仮説
        key: beh
        chain-label: 状況・行動
        role: customer
        description: 想定顧客が今どんな状況に置かれ、実際にどう行動しているか（課題の手前の観察可能な事実）。「誰が・どんな文脈で・何をしているか」を捉える。
      - name: 課題仮説
        key: prob
        chain-label: 切実な課題
        role: problem
        description: その顧客が抱える、対価を払ってでも解きたいほど切実な課題。行動の裏にある痛み。CPF/FPF の中心。
      - name: ソリューション仮説
        key: sol
        chain-label: ソリューション
        role: solution
        description: 課題を解く打ち手と、その独自の価値提案。addresses で対応課題に結ぶ。PSF/SPF の中心。
      - name: 市場スケール仮説    # 市場役割の型（PMF）。個別購買（対価・WTP）は型にせず、ソリューション仮説を〈支払い〉証拠で検証する観点として扱う
        key: mkt
        chain-label: 市場スケール
        role: market
        description: チャネル・収益・コスト・主要指標が成立し反復可能にスケールするか。PMF の中心。個別購買（対価・WTP）は型にせず、ソリューション仮説を〈支払い〉証拠で検証する観点として扱う。
      - name: 自分たち仮説
        key: team
        chain-label: 自分たち
        role: team
        description: なぜ自分たちがこの課題に取り組むのか、模倣困難な圧倒的優位性（Unfair Advantage）。FPF の一角。

  TEST:
    label: 実験計画
    dir: tests
    description: テストカード。検証前に記入する計画で、「動いて検証する(Act)→学ぶ(Learn)」の計画側として目的・方法・指標・成功基準・riskiest-assumption を宣言する。学び(LEARN)が紐づくまでは自由に直してよく、紐づいた後は下記 immutable の範囲だけを凍結する（後知恵バイアス防止）。検証後の学びは LEARN（別レコード）に積む。
    fields:
      - name: id
        required: true
        kind: id
        description: ファイル名と一致する接頭辞つきID。
        example: SELF-TEST-001
      - name: title
        required: true
        kind: text
        description: 何を誰にどう当てる実験かが一読で分かる短いタイトル。
        example: 実践者5名への問題インタビュー（CPF 5仮説の一次検証）
      - name: type
        required: true
        kind: subtype
        description: 活動種別。スクリプト雛形の選択（/planning）と log.md の type に対応する。
        example: interview
      - name: date
        required: true
        kind: date
        description: 計画日。実施日ではない（実施日は紐づく学び LEARN の date が正本）。
        example: "2026-08-02"
      - name: stage
        required: true
        kind: enum
        enum-ref: stages
        description: この実験がどのステージの問いを検証するか。
        default: CPF
      - name: hypotheses
        required: true
        kind: relation
        description: この実験が検証する仮説（複数可）。仮説側からは「検証活動」として逆引きされる。
        guidance: 本文にも wikilink を書く（must-wikilink。frontmatter だけでは Obsidian グラフに辺が出ない）。
        example: "[SELF-H-001, SELF-H-002]"
      - name: riskiest-assumption
        required: true
        kind: text
        description: この実験で崩れたら全体が崩れる一点を一文で。board の背骨になる。
        guidance: |
          検証前に確定し、学び(LEARN)が紐づいた後は凍結される（immutable.fields）。
          後知恵で「もともとそこは狙っていなかった」と書き換えられないようにするための凍結。
        example: 「作る前に検証を反復する実践者」が実在し、記録の課題にすでに実コストを払っている
      - name: data
        required: true
        kind: enum
        enum-ref: data-kinds
        description: この実験が「何のデータで作られるか」（何について書いてあるかではない）。架空判定 fictional-cap の正本。
        guidance: |
          未宣言を許すと本文マーカー語の推論に黙って落ち、宣言漏れが静かに「実データ」扱いになって
          fictional-cap が効かない（＝架空由来の確信度が上限なく上がる）。黙って劣化させるくらいなら
          書かせて弾く。推論経路自体は他 vault・旧レコードのために残す。
        example: real
      - name: success-criteria
        required: false
        kind: structured
        description: 成功基準のうち数えられるものを機械可読にした背骨。本文の散文と二重表現。
        guidance: |
          散文を置き換えるものではない（ニュアンスは散文が担う）。数を決めていない基準は載せない
          ＝ここに無いものは人が判定する、という契約。検証前に確定し、実施後は riskiest-assumption と
          同格で凍結される（数値だけ後から動かせるなら節を凍らせた意味が無い）。
        example: "[{hypothesis: SELF-H-001, metric: 反復を語った人数, op: '>=', threshold: 3, of: 5}]"
    # 凍結（不変ルール6）の適用範囲。「実験が実施された」＝trigger-relation でこの TEST を指すレコードが
    # 在る、とみなし、以後ここに挙げた本文節・frontmatter キー**だけ**を書き換え禁止にする。
    # 目的・方法・指標の補正／スクリプト・プロトタイプへのリンク追加／誤字修正は実施後も許す
    # （後知恵バイアス防止に必要なのは、事後に成功基準と riskiest-assumption を改竄させないことだけ）。
    # tools/check_testcard_immutable.py と tools/hwlint.py の testcard-sections がここを読む。
    immutable:
      trigger-relation: learns-from
      sections: [成功基準]              # 本文節（見出し `### <name>` / 箇条書き `- **<name>**:` の両形式）
      # frontmatter キー。success-criteria は成功基準の機械可読な背骨なので、散文の節と同格で凍らせる
      # （数値だけ後から動かせるなら、節を凍らせた意味が無い）。
      fields: [riskiest-assumption, success-criteria]
    subtypes:
      - {name: interview}
      - {name: demo}
      - {name: survey}
      - {name: mvp-test}
      - {name: desk-research}
      - {name: self-reflection}

  LEARN:
    label: 学び
    dir: learnings
    description: 学習カード。検証後に新規作成する「実施して学びを得た」出来事。事実(observed)と解釈(inference)を分け、outcome（判定）と確信度更新を記録する。1つの学びが複数の仮説を動かすときは judgments で仮説ごとの判定を、実験計画の success-criteria に対する実測は measurements で持つ（outcome だけでは「どの仮説が崩れたか」がグラフから消える）。計画型は learns-from で TEST を参照し、回顧型（desk-research/self-reflection 等）は TEST を持たず自身が活動種別を名乗る。サブタイプは活動種別（TEST と同じ語彙）。sources で根拠となった生データ（不変層）を指し、確信度の根拠鎖を端まで辿れるようにする。
    fields:
      - name: id
        required: true
        kind: id
        description: ファイル名と一致する接頭辞つきID。
        example: SELF-LEARN-001
      - name: title
        required: true
        kind: text
        description: 何から何を学んだかが一読で分かる短いタイトル。
        example: 企業の仮説検証の状況・課題のデスクリサーチ
      - name: type
        required: true
        kind: subtype
        description: 活動種別（TEST と同じ語彙）。回顧型（desk-research/self-reflection）はここで自身の種別を名乗る。
        example: interview
      - name: date
        required: true
        kind: date
        description: 実施日。計画型ではこちらが実施日の正本で、TEST の date は計画日。
        example: "2026-07-16"
      - name: stage
        required: true
        kind: enum
        enum-ref: stages
        description: この学びがどのステージの問いに答えたか。
        default: CPF
      - name: learns-from
        required: false
        kind: relation
        description: 実施した実験計画(TEST)を1つ指す。board が「1実験＝計画＋学び」を1行に束ねる。
        guidance: |
          回顧型（desk-research / self-reflection / chabudai）は事前の計画を立てないので持たない。
          持たない学びは board で「—（回顧型・事前の実験計画なし）」として表示される。
        example: SELF-TEST-001
      - name: hypotheses
        required: true
        kind: relation
        description: この学びが確信度を動かした仮説（複数可）。
        guidance: 本文にも wikilink を書く（must-wikilink）。
        example: "[SELF-H-001, SELF-H-002]"
      - name: outcome
        required: true
        kind: enum
        enum-ref: outcomes
        description: レコード全体の判定を1語で。board サマリの判定列へ射影される。
        guidance: |
          対象仮説ごとに結論が違うときは、これだけでは「どの仮説が崩れたか」がグラフから消える。
          その場合は judgments に仮説ごとの判定を書く。
        example: 支持
      - name: judgments
        required: false
        kind: structured
        description: 仮説ごとの判定。hypotheses が複数で結論が分かれるときのレコード内訳。
        required-when:
          condition: outcome が真偽判定（judgment-check.truth-outcomes）で、hypotheses が2件以上のとき
          severity: warning
          enforced-by: judgment-coverage
        example: "[{hypothesis: SELF-H-001, outcome: 反証}]"
      - name: measurements
        required: false
        kind: structured
        description: 実験計画(TEST)の success-criteria に対して実際に観測した値。metric 名で基準と対応させる。
        guidance: |
          これがあると lint が判定を検算でき、「基準を割ったのに支持」＝ゴールポストの事後移動を
          error で弾ける（judgment-mismatch）。慎重側（判断保留）へ倒すのは常に許される。
        example: "[{metric: 反復を語った人数, value: 3, n: 5}]"
      - name: sources
        required: false
        kind: provenance
        description: 根拠となった生データ（不変層 sources/ 基準の相対パス）。確信度の根拠鎖の末端。
        guidance: |
          本文にも相対mdリンクを置く（二重表現。生データは接頭辞つきノートでないので wikilink は解決しない）。
          生データ冒頭の架空/シミュレーション宣言はここから読まれる。
        required-when:
          condition: type が provenance.required-for-types（観測を伴う活動種別）のとき
          severity: warning
          enforced-by: provenance
        example: "[2026-07-16-desk-research-corporate-hypothesis-testing.md]"
      - name: data
        required: true
        kind: enum
        enum-ref: data-kinds
        description: この学びが「何のデータで作られたか」（何について書いてあるかではない）。架空判定 fictional-cap の正本。
        guidance: |
          必須の理由は TEST.data と同じ。架空データを**論じた**是正・監査レコードは real である
          （混同すると実データの実験が架空に誤分類される）。
        example: real
    subtypes:
      - {name: interview}
      - {name: demo}
      - {name: survey}
      - {name: mvp-test}
      - {name: desk-research}
      - {name: self-reflection}

  DEC:
    label: 意思決定
    dir: decisions
    description: ステージ移行・ピボット・撤退・巻き戻しなどの節目の判断。based-on で根拠の LEARN/TEST に結び、to-stage を持つ最新 DEC が現在ステージの正本になる。巻き戻しポイントと次の一手を残す。
    fields:
      - name: id
        required: true
        kind: id
        description: ファイル名と一致する接頭辞つきID。
        example: SELF-DEC-001
      - name: title
        required: true
        kind: text
        description: 何をどう決めたかが一読で分かる短いタイトル。
        example: CPF の一次検証を終え FPF へ移行する
      - name: date
        required: true
        kind: date
        description: 判断した日。to-stage を持つ DEC の最新性はこの日付で決まる。
        example: "2026-08-20"
      - name: type
        required: true
        kind: subtype
        description: 判断の種類。ステージを動かすのは主に stage-transition と rollback。
        example: stage-transition
      - name: based-on
        required: false
        kind: relation
        description: 根拠にした学び(LEARN)・実験計画(TEST)（複数可）。判定を持つ LEARN を優先する。
        guidance: 本文にも wikilink を書く（must-wikilink）。
        required-when:
          condition: 常に（根拠なき意思決定を作らない）
          severity: warning
          when: always
        example: "[SELF-LEARN-002]"
      - name: to-stage
        required: false
        kind: enum
        enum-ref: stages
        description: この判断の結果ステージ。to-stage を持つ最新 DEC が現在ステージの正本になる。
        guidance: |
          ステージを動かす判断（stage-transition・rollback 等）だけが持つ。空だとビュー・ツールが
          現ステージを導出できず、wiki/stage.md のフォールバックに落ちる。
        example: FPF
    subtypes:
      - {name: stage-transition}
      - {name: pivot}
      - {name: persevere}
      - {name: rollback}
      - {name: kill}

# ── 付随物（attachments） ───────────────────────────────────────────
# 付随物は**新しいレコード種別ではない**。親レコードに従属する成果物で、独自のID体系を
# 持たず（ファイル名 = 親レコードID + suffix）、置き場も親と同じディレクトリを使う。
# それでいて型付きリンク（relations）には参加するので、lint がリンク切れ・型違反を検出でき、
# Obsidian のグラフにも本文 wikilink 経由で現れる。
#
# **レコード(entities)と分ける理由は思想でなく正しさ**: ステム `SELF-TEST-006-script` には
# `-TEST-` が含まれるため、レコードとして読み込むと records.py の entity_of が "TEST" を返し、
# コード中の `"-TEST-" in stem` 系（board/list/index 生成・テストカード不変チェック）が
# 付随物を実験計画として飲み込む。読み取り層は records と attachments を別コレクションに保つ。
#
# 種別の解決は suffix でおこなう（ID_RE は緩めない）。付随物を先に判定すること
# （records.py の node_kind。entity_of を先に見ると上記の理由で必ず誤判定する）。
attachments:
  SCRIPT:
    label: スクリプト
    parent: TEST            # 親レコード種別。置き場(dir)は親から導出する（宣言しない＝ドリフト防止）
    suffix: -script         # ファイル名 = <親レコードID><suffix>.md
    description: interview/demo の実験計画(TEST)の「方法」を現場の会話に落とした台本。/planning がテストカードと対で生成する。事前登録した反証条件・記録シートを載せ、観測をそのまま受け止める器になる。確信度は動かさない（学びは LEARN に積む）。
    fields:
      - name: id
        required: true
        kind: id
        description: ファイル名と一致する。付随物なので独自の採番を持たず「親レコードID + suffix」。
        example: SELF-TEST-001-script
      - name: title
        required: true
        kind: text
        description: どの実験の台本かが分かる短いタイトル。
        example: 実践者5名への問題インタビュー スクリプト
      - name: type
        required: true
        kind: subtype
        description: 基にした雛形（templates/<type>-script.md）。/planning の雛形選択がこの語彙に対応する。
        example: problem-interview
      - name: script-for
        required: true
        kind: relation
        description: 台本化した実験計画(TEST)。ファイル名から導ける対応を frontmatter にも明示する。
        example: SELF-TEST-001
      - name: hypotheses
        required: false
        kind: relation
        description: 台本が実際に当てる仮説。親 TEST の検証対象の部分集合でなければならない。
        guidance: |
          省略可なのは**発見型のスクリプトが既存仮説を相手に語らない**設計だから。仮説を宣言すると
          台本の意図と食い違う。本文で背景として別の仮説に言及するのは正当なので、逆向き
          （本文の wikilink をすべて宣言せよ）は課さない。
        example: "[SELF-H-001, SELF-H-002]"
    # サブタイプ = 基にした雛形（templates/）。/planning の雛形選択はこの語彙に対応する。
    # date・stage は持たせない（親 TEST から導けるので二重管理になる）。
    subtypes:
      - name: problem-interview
        template: templates/problem-interview-script.md
        description: 課題の実在・自認・実コストを過去の事実で聞く（CPF/FPF）。ソリューションは見せない・語らない。
      - name: solution-interview
        template: templates/solution-interview-script.md
        description: 提示物への反応・乗り換え・〈支払い〉を聞く（PSF/SPF）。
      - name: demo
        template: templates/demo-script.md
        description: デモの司会・観察の台本（主に PSF）。作らずに価値の芯を当てる。

# ── 関係（型付きリンク） ─────────────────────────────────────────────
# field         = frontmatter キー
# domain / range= 始点 / 終点のノード種別（エンティティ または 付随物）。単一種別は文字列、複数種別を許すときは配列で書く（例 [TEST, LEARN]）
# *-subtypes    = 省略可。サブタイプまで制約する場合のみ
# cardinality   = one（単一）| many（配列）
# inverse       = 逆方向の呼称（バックリンク表示・ナビゲーションに使う）
# must-wikilink = true なら本文にも wikilink を張る（Obsidian グラフに辺を出すため）
relations:
  - name: derived-from
    field: derived-from
    domain: H
    range: H
    cardinality: one
    inverse: derives
    must-wikilink: true
    label: 派生元
    inverse-label: 派生先
    description: この仮説が枝分かれした元の仮説（親は1つ）。ピボットや巻き戻しの再出発点を系譜として残し、なぜこの仮説に至ったかの履歴を辿れるようにする。過去向きのリンク。

  - name: leads-to
    field: leads-to
    domain: H
    range: H
    cardinality: many
    inverse: led-from
    must-wikilink: true
    label: 因果先
    inverse-label: 因果元
    description: この仮説が成り立つと次に導かれる仮説（複数可）。状況→課題→ソリューション→市場という価値連鎖を前向きにつなぎ、list ビューの mermaid バリューチェーン矢印になる。derived-from が過去向きなのに対しこちらは前向き。

  - name: addresses
    field: addresses
    domain: H
    domain-subtypes: [ソリューション仮説]
    range: H
    range-subtypes: [課題仮説]
    cardinality: many
    inverse: addressed-by
    must-wikilink: false      # relations のフィット表は frontmatter から射影。本文 wikilink は必須にしない
    label: 対応課題
    inverse-label: 対応する価値
    description: このソリューション仮説が解こうとする課題仮説（複数可）。打ち手と痛みの対応＝バリュープロポジションのフィットを表し、relations ビューのフィット表になる。始点と終点の型が限定される唯一の関係。フィット表は frontmatter から射影するため本文 wikilink は必須にしない。

  - name: hypotheses
    field: hypotheses
    domain: [TEST, LEARN, SCRIPT]   # 計画(TEST)は検証対象、学び(LEARN)は確信度を動かした仮説、スクリプト(SCRIPT)は台本が実際に当てる仮説
    range: H
    cardinality: many
    inverse: validated-by
    must-wikilink: true
    label: 検証対象
    inverse-label: 検証活動
    description: この実験計画(TEST)が狙う、または学び(LEARN)が確信度を動かした仮説（複数可）。TEST と LEARN の両方が始点になれ、同じ仮説群を指すことで「計画→結果」が1本に束なる。仮説側からは逆引き（検証活動）で「どの活動がこの仮説を検証したか」を辿れる。付随物のスクリプト(SCRIPT)も始点になれるが、台本が実際に当てる仮説は親 TEST の検証対象の部分集合でなければならない（発見型スクリプトは仮説を伏せるので空でよい）。

  - name: script-for
    field: script-for
    domain: SCRIPT
    range: TEST
    cardinality: one
    inverse: script
    must-wikilink: true
    label: 対象の実験計画
    inverse-label: スクリプト
    description: このスクリプトが台本化した実験計画(TEST)。ファイル名（親ID + suffix）から導ける対応を frontmatter にも明示し、機械可読にする。付随物を始点とする唯一の関係で、親は必ず1つ。

  - name: learns-from
    field: learns-from
    domain: LEARN
    range: TEST
    cardinality: one
    inverse: learnings
    must-wikilink: true
    label: 実験計画
    inverse-label: 学び
    description: この学びが実施した実験計画（テストカード）を1つ指す。計画(TEST)と結果(LEARN)を1対1で束ね、board ビューが「1実験＝計画＋学び」を1行にまとめる。回顧型（desk-research/self-reflection 等）は計画を立てず学びだけ作るため持たない。

  - name: based-on
    field: based-on
    domain: DEC
    range: [TEST, LEARN]        # 意思決定は実験計画(TEST)にも判定を持つ学び(LEARN)にも根拠を置ける
    cardinality: many
    inverse: informs
    must-wikilink: true
    label: 根拠活動
    inverse-label: 導いた判断
    description: この意思決定が根拠にした学び(LEARN)・実験計画(TEST)（複数可）。判定を持つ LEARN を優先する。判断がどの証拠に基づいたかを追跡でき、活動側からは逆引き（導いた判断）でその活動がどの決定を導いたかを辿れる。

# ── プロヴェナンス（出典＝不変層 sources/ への参照） ──────────────────
# 型付きリンク(relations)は record→record。出典は「グラフの外を指す属性」なので別に宣言する
# （relation にすると domain/range ⊆ entities の不変条件を壊す）。
#
# この宣言が担うのは、確信度の根拠鎖の**最後の一歩**である:
#   H の確信度履歴 → [[LEARN-NNN]] → sources/<生データ>
# ここが機械可読でないと (a) 出典切れが検出できず、(b) 生データ冒頭の架空宣言が
# fictional-cap の判定に届かず（＝架空データで確信度を水増ししても気づけず）、
# (c) sources/ に置いたのに取り込まれていない生データを拾えない。
provenance:
  field: sources                    # frontmatter キー（base-dir 基準の相対パス配列）
  domain: [LEARN]                   # 出典を持つレコード種別
  cardinality: many
  base-dir: sources                 # projects/<slug>/ 配下の基準ディレクトリ
  must-body-link: true              # 本文にも相対mdリンクを置く（schema層と同じ記法。wikilink は使わない）
  # この活動種別の LEARN は出典を要する（欠落は warning）。
  # self-reflection は内省なので出典なしを正当とする（chabudai の揺さぶり材料があれば書いてよい）。
  required-for-types: [interview, demo, survey, mvp-test, desk-research]
  fictional-header-scan-lines: 12   # 出典冒頭N行の fictional-markers を架空判定の一次情報にする

# ── 構造化フィールド（行の集まりを持つ frontmatter キー） ──────────────
# 平坦な key: value でも、record→record の relation でもない第三の形。
# **1レコードに複数行あり、行の中に構造がある**もの（仮説ごとの判定・成功基準・実測）を宣言する。
#
# なぜ必要か: `hypotheses` は many なのに `outcome` はレコードに1つしかない。1つの学びが
# 3仮説を見て「1つは反証・2つは据え置き」と判定しても、frontmatter に残るのは要約1語だけで、
# **仮説ごとの結論はグラフから消えて散文にしか残らない**。判定の粒度を仮説に合わせるための層。
#
# 読み取り: parse_frontmatter は「素の文字列」契約で入れ子を潰すので、これらは
# records.py の struct_field（入れ子を保つ別経路）で読む。
#
# キーの kind:
#   ref    … 同じレコードの ref-field（関係キー）が指す集合の要素であること
#   enum   … enum-ref が指す語彙
#   number … 数値
#   text   … 自由記述
structured-fields:
  judgments:
    domain: [LEARN]
    label: 仮説ごとの判定
    description: この学びが対象仮説それぞれをどう判定したか。hypotheses が複数のとき、レコード単位の outcome では表せない結論の違いをここに残す。board が仮説単位に射影し、「反証されたのに誰も判断していない」の機械判定の材料になる。
    keys:
      - {name: hypothesis, required: true,  kind: ref, ref-field: hypotheses,
         description: 判定した仮説。この学びの hypotheses に含まれていること}
      - {name: outcome,    required: true,  kind: enum, enum-ref: outcomes,
         description: その仮説に対する判定}
      - {name: note,       required: false, kind: text,
         description: 判定の一言理由（詳細は本文に書く）}

  success-criteria:
    domain: [TEST]
    label: 成功基準（機械可読な背骨）
    description: 本文「成功基準」節の散文を置き換えるものではなく、検算できる骨だけを取り出したもの。実施前に確定し、実施後は凍結する（immutable.fields）。実測（measurements）と突き合わせて、数値と真逆の判定を弾くために使う。
    keys:
      - {name: hypothesis, required: true,  kind: ref, ref-field: hypotheses,
         description: この基準が判定する仮説。この実験の hypotheses に含まれていること}
      - {name: metric,     required: true,  kind: text,
         description: 測る対象の名前。学び(LEARN)の measurements.metric と文字列一致させる}
      - {name: op,         required: true,  kind: enum, enum-ref: criteria-ops,
         description: 比較演算子。実測値を左辺に置いて評価する}
      - {name: threshold,  required: true,  kind: number,
         description: 満たすべき閾値}
      - {name: of,         required: false, kind: number,
         description: 母数（「5名中3名」の5）。実測の n と食い違えば warning}

  measurements:
    domain: [LEARN]
    label: 実測
    description: 実験計画(TEST)の success-criteria に対して実際に観測した値。metric 名で基準と突き合わせる。判定（judgments・outcome）が実測と真逆でないことを lint が検算する＝ゴールポストの事後移動を数値で弾く。
    keys:
      - {name: metric, required: true,  kind: text,
         description: 実験計画(TEST)の success-criteria.metric と一致させる名前}
      - {name: value,  required: true,  kind: number,
         description: 実際に観測した値}
      - {name: n,      required: false, kind: number,
         description: 母集団（何人・何件を見たか）。基準の of と食い違えば warning}
      - {name: note,   required: false, kind: text,
         description: 観測条件の補足（詳細は本文に書く）}

# ── 状態機械 ────────────────────────────────────────────────────────
state-machines:
  # 検証ステージ（正式名称は playbooks/<stage>.md の見出しが正典）
  stages:
    order: [CPF, FPF, PSF, SPF, PMF]
    names:
      CPF: Customer Problem Fit
      FPF: Founder Problem Fit
      PSF: Problem Solution Fit
      SPF: Solution Product Fit
      PMF: Product Market Fit

  # ステージ→重点仮説タイプ（importance: auto の解決に使う）
  stage-focus:
    CPF: [状況・行動仮説, 課題仮説]
    FPF: [課題仮説, 自分たち仮説]
    PSF: [ソリューション仮説]
    SPF: [ソリューション仮説]
    PMF: [市場スケール仮説]

  # importance: auto の重み。現在ステージの重点タイプ=focus、それ以外=other。
  # 手動指定（1-10）があればそれが優先（ビュー側で処理）。「次に検証すべき」の閾値も focus を使う。
  importance-weights:
    focus: 8
    other: 4

  # 検証ステータス（並び順 = ビューの集計・表示順）
  statuses:
    - {name: 検証済み, emoji: "✅", description: 実験で支持され、確信度も相応に高い（証拠の階梯を満たす）状態}
    - {name: 検証中,   emoji: "🔄", description: 実験に着手したが結論が出きっていない状態。判断保留（確信度3-4）も手応え（5-6）も正当}
    - {name: 未検証,   emoji: "⚪", description: まだ実験で確かめていない状態。起票直後の初期値}
    - {name: 反証,     emoji: "❌", description: 実験で否定された状態。もはや信じていないので確信度も低いはず}

  # 学び(LEARN)の検証判定（frontmatter outcome）。board サマリの outcome 列へ射影する。
  # 成功基準の機械判定は〈支持／反証／判断保留〉の3値で、起票・是正はそれ以外の記録行為。
  outcomes:
    - {name: 起票,     description: 仮説を起票した（確信度の初期値を置いた。真偽判定ではない）}
    - {name: 支持,     description: 成功基準を満たし仮説が支持された}
    - {name: 反証,     description: 成功基準を満たさず仮説が否定された}
    - {name: 判断保留, description: 実験したが結論が出ず証拠が足りない（確信度は原則上げない）}
    - {name: 是正,     description: 記録・運用の誤りを正した（仮説の真偽判定ではないので確信度は動かさない）}

  # 成功基準（success-criteria）の比較演算子。実測（measurements.value）を左辺に置いて評価する。
  criteria-ops: [">=", ">", "<=", "<", "==", "!="]

  # 実測から導いた判定と、著者が書いた判定（judgments / outcome）を突き合わせるときの方針。
  # **数値と真逆の結論だけを弾く**（hwlint の judgment-mismatch）。
  #   - 全基準を満たしたのに 反証 と書いた   → error（数値と結論が逆）
  #   - 全基準を割ったのに 支持 と書いた     → error（ゴールポストの事後移動。本命）
  #   - 満たしたが 判断保留 と書いた         → 許す（慎重側への倒しは常に正当）
  #   - 一部だけ満たした（mixed）           → 導出しない（人の解釈に委ねる）
  #   - 起票・是正                          → 対象外（仮説の真偽判定ではない）
  # 「慎重側は許す」が非対称の要点。機械は確証の水増しだけを止め、疑うことは止めない。
  judgment-check:
    truth-outcomes: [支持, 反証, 判断保留]   # 真偽判定を名乗る outcome（これ以外は検算・被覆の対象外）
    supported: 支持
    refuted: 反証

  # 実験計画(TEST)・学び(LEARN)の**データ種別**（frontmatter data）。fictional-cap 判定の正本。
  # 「そのレコードが何のデータで作られたか」であって「何について書いてあるか」ではない
  # （架空データを**論じた**是正・監査レコードは real。混同すると実データの実験が架空に誤分類される）。
  data-kinds:
    - {name: real,      description: 実観測（実在の相手・実際の計測）に由来する}
    - {name: simulated, description: 架空/シミュレーション由来（生成データ。確信度は fictional-cap で頭打ち）}

  # 確信度（1-10）
  confidence:
    min: 1
    max: 10
    # 確信度の帯ごとの目安（証拠の強さの水準）。この表が確信度スケールの正本（CLAUDE.md からは参照）。
    bands:
      - {range: "1-2",  meaning: 勘・思いつき}
      - {range: "3-4",  meaning: 二次情報・状況証拠あり}
      - {range: "5-6",  meaning: 検証中で手応えあり（定性的証拠が集まりつつある）}
      - {range: "7-8",  meaning: 検証済みで確信度が高い}
      - {range: "9",    meaning: 反証を試みても崩れなかった}
      - {range: "10",   meaning: 事実（観測された確定事項）}
    fictional-cap: 8          # 架空/シミュレーションデータ由来の確信度は上限8
    # 二次情報（自分で観測していない外部の調査・記事＝〈二次〉タグ）だけを根拠にした確信度の上限。
    # 帯 3-4「二次情報・状況証拠あり」の上端に対応する。/desk-research が起票時に守る規律で、
    # かつてスキルの散文にしか存在せず（オントロジー側に無く）何も強制していなかった。
    # 現時点では宣言と可視化まで（lint 化していない）— 複数の独立出典が同じ事実を指すときの
    # 上げ幅は解釈を伴い、機械で一律に弾くと正当な起票まで止めてしまうため。
    secondary-source-cap: 4
    # 架空データを示すマーカー語彙。用途は2つで、**強さが違う**:
    #   (1) 生データ(sources/)冒頭 N 行の宣言を読む一次情報（provenance.fictional-header-scan-lines）
    #   (2) TEST/LEARN 本文の後方互換フォールバック — **data 未宣言 かつ 出典を1件も持たない**
    #       レコードにだけ効く。本文の語は「何のデータで作られたか」でなく「何について書いてあるか」を
    #       拾ってしまうので、判定の正本は data-kinds の宣言側に置く（旧 AR-12）。
    fictional-markers: [架空, シミュレーション]
    # status × 確信度の許容域（外れたら warning）。検証の2軸の食い違い（矛盾）を検出する。
    status-bounds:
      検証済み: {min: 5}      # 検証済みなのに確信度が低い
      反証:     {max: 4}      # 反証なのに確信度が高い（もはや信じていないはず）
      未検証:   {max: 4}      # 未検証なのに確信度が高い（証拠なき高確信）
      # 検証中 は判断保留(3-4)〜手応え(5-6)まで幅広く正当。境界を設けない。
    # 確信度の帯ごとに要求する証拠の階梯の最低段（evidence-ladder の名）。
    # 本文の根拠タグにこの段以上の階梯タグが無いのに確信度だけ高い、を検出する（warning）。
    evidence-floor:
      - {min-confidence: 5, floor: 自認}      # 5-6 は〈自認〉以上を要する
      - {min-confidence: 7, floor: 実コスト}   # 7-8 は〈実コスト〉以上を要する

  # 陳腐化（時間軸）の閾値。**数値は自動で下げない**（不変ルール1厳守）。再検証を促す可視化のみ。
  # 市場・前提が動く仮説検証ドメインでは「半年前の確信度8」と「昨日の8」は同格でない、という観点。
  staleness:
    confidence-days: 180   # status:検証済み かつ evidence-floor を要する確信度で、履歴最終行がこれより古い → warning
    test-days: 14          # 学び(LEARN)が紐づかない実験計画(TEST)がこれより古い → warning（計画したのに放置）
  # 証拠の階梯（弱→強）。確信度を上げる根拠の強さの序列。
  # 本文の根拠セルでは 〈発言〉のように山括弧つきで書く（ツールが山括弧を補う）。
  # 要素は {name, desc}。序列は記載順（先頭が最弱）。name のみ書いた文字列でも後方互換で読める。
  evidence-ladder:
    - {name: 発言,     desc: 好意的な意見・「いいね」（interest。最も弱い）}
    - {name: 自認,     desc: 自分の言葉で課題を語る（課題の存在を本人が認める）}
    - {name: 実コスト, desc: 時間・金・手戻りを既に払っている証拠（課題が実在するコスト痕跡）}
    - {name: 行動,     desc: 実際にとった行動・現在の使用（言うだけでなく動いている）}
    - {name: 支払い,   desc: 対価・前払い・導入コミット（intent。最も強い）}
  # 階梯外の補助タグ（強さの序列を持たない証拠種別）。
  evidence-aux:
    - {name: 二次, desc: 二次情報（自分で観測していない外部の調査・記事など）}
    - {name: 架空, desc: 架空/シミュレーション由来（実観測でない。確信度は fictional-cap で頭打ち）}

# ── リーンキャンバス（仮説検証への写像） ─────────────────────────────
# リーンキャンバス(Ash Maurya)は**新しいレコード種別ではなく**、既存の仮説(H)群を
# 事業モデルの9ブロックへ射影した「ビュー」。/lean-canvas スキルが使う。
#   - 各ブロックは H サブタイプの役割(role)に対応する（maps-to-role。role の正本は
#     entities.H.subtypes.role。サブタイプ名でなく役割で結ぶのでドリフトに強い）。
#   - ブロックの検証状態は、対応 role の H の status から導出する（block-status）。新レコードは作らない。
# 心得(Why=本家準拠の方法論)は playbooks/lean-canvas.md、現場手順(How)は .claude/skills/lean-canvas/。
lean-canvas:
  # /lean-canvas がキャンバスSVGを書き出す先（wiki/ からの相対）。index ビューが最新1枚を埋め込む。
  artifact-dir: lean-canvas
  # sketch-order = 本家推奨の記入順（網羅のための順。同値は一緒に描く）。
  # 検証の優先順は別（validation-order 参照）。
  blocks:
    - {key: segment,   label: 顧客セグメント,   en: Customer Segments,          maps-to-role: customer, sketch-order: 1}
    - {key: problem,   label: 課題,             en: Problem,                    maps-to-role: problem,  sketch-order: 2}
    - {key: uvp,       label: 独自の価値提案,   en: Unique Value Proposition,   maps-to-role: solution, sketch-order: 3}
    - {key: solution,  label: ソリューション,   en: Solution,                   maps-to-role: solution, sketch-order: 4}
    - {key: channels,  label: チャネル,         en: Channels,                   maps-to-role: market,   sketch-order: 5}
    - {key: revenue,   label: 収益の流れ,       en: Revenue Streams,            maps-to-role: market,   sketch-order: 6}
    - {key: cost,      label: コスト構造,       en: Cost Structure,             maps-to-role: market,   sketch-order: 6}
    - {key: metrics,   label: 主要指標,         en: Key Metrics,                maps-to-role: market,   sketch-order: 7}
    - {key: advantage, label: 圧倒的優位性,     en: Unfair Advantage,           maps-to-role: team,     sketch-order: 8}

  # ブロック検証状態の射影規則（対応 role の H 群から導出。新レコード・新ステータスは作らない）。
  block-status:
    - {name: 検証済み, from: 対応roleのHにstatus=検証済みが1件以上}
    - {name: 未検証,   from: 対応roleのHはあるがstatus=検証済みが無い}
    - {name: 空白,     from: 対応roleのHが1件も無い（＝未着手の盲点）}

  # 検証の優先順は記入順(sketch-order)と別。本家: 左→右で埋めず、最もリスキー（重要×証拠なし）な前提から検証する。
  # 具体の優先度は TEST frontmatter の riskiest-assumption と /planning の重要度×証拠マップで決める。
  validation-order: riskiest-first

  # ブロックの意味はステージで変わる（本家の3段階: 課題解決フィット→PMF→スケール）。
  # early = 初期(CPF/PSF付近)の検証レンズ / scale = 後期(PMF以降)のレンズ。
  stage-lens:
    channels:
      early: 想定顧客に会って学ぶための経路（Day1から作る「顧客への道」。インタビュー・デモに到達する手段）
      scale: 反復可能でスケールする流通チャネル
    metrics:
      early: 顧客工場(AARRR)のどの一歩が詰まっているかを見る少数の学習指標
      scale: 事業の健全性を測る主要指標
    revenue:
      early: 価格も仮説。〈支払い〉意思の検証対象（interest ≠ intent）
      scale: 反復可能な収益モデル
